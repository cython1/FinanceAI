# Prepares the environment the Copilot coding agent works in.
# The job must be named `copilot-setup-steps`. Install steps are skipped
# until each package has been scaffolded (FAI-006, FAI-018, FAI-028).
name: Copilot setup steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python worker dependencies (pyproject)
        if: hashFiles('python-worker/pyproject.toml') != ''
        working-directory: python-worker
        run: pip install -e ".[dev]"

      - name: Install Python worker dependencies (requirements.txt)
        if: hashFiles('python-worker/pyproject.toml') == '' && hashFiles('python-worker/requirements.txt') != ''
        working-directory: python-worker
        run: pip install -r requirements.txt

      - name: Install Node API dependencies
        if: hashFiles('node-api/package-lock.json') != ''
        working-directory: node-api
        run: npm ci

      - name: Install frontend dependencies
        if: hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: npm ci

# Claude as a coding agent on this repo.
#
# Ways to give Claude work:
#   - Add the `claude` label to an FAI issue  -> Claude implements it and opens a PR
#   - Comment `@claude ...` on an issue or PR -> Claude answers or makes the change
#   - Mention `@claude` in a PR review        -> Claude addresses the review
#
# Setup (one time, repo admin):
#   1. Install the Claude GitHub App on this repo: https://github.com/apps/claude
#   2. Add ONE repository secret:
#        CLAUDE_CODE_OAUTH_TOKEN  (Claude Pro/Max: run `claude setup-token` locally)
#      or ANTHROPIC_API_KEY       (Claude Console API key; then swap the input below)
#
# Claude reads CLAUDE.md -> AGENTS.md for project rules, and .mcp.json for MCP servers.
name: Claude

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude') ||
      (github.event_name == 'issues' && github.event.action == 'opened' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python worker dependencies (pyproject)
        if: hashFiles('python-worker/pyproject.toml') != ''
        working-directory: python-worker
        run: pip install -e ".[dev]"

      - name: Install Python worker dependencies (requirements.txt)
        if: hashFiles('python-worker/pyproject.toml') == '' && hashFiles('python-worker/requirements.txt') != ''
        working-directory: python-worker
        run: pip install -r requirements.txt

      - name: Install Node API dependencies
        if: hashFiles('node-api/package-lock.json') != ''
        working-directory: node-api
        run: npm ci

      - name: Install frontend dependencies
        if: hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: npm ci

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: claude
          branch_prefix: feature/
          branch_name_template: "{{prefix}}FAI-{{entityNumber}}-{{description}}"
          track_progress: true
          claude_args: |
            --mcp-config .mcp.json
            --allowedTools "mcp__microsoft-learn,mcp__context7,Bash(cd:*),Bash(npm:*),Bash(npx:*),Bash(pip install:*),Bash(pytest:*),Bash(python -m pytest:*),Bash(ruff:*),Bash(python -m ruff:*),Bash(timeout:*),Bash(sleep 5),Bash(curl -s http://localhost:3000/health)"

# Validates the shared contracts (shared/) on every pull request into main.
#
# The job always runs and always reports a status, so it can be marked as a
# required check without blocking PRs that don't touch shared/. The check itself
# only runs when shared/ or this file changed.
name: shared contracts CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: shared-contracts-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: shared contracts check
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect shared/ changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -qE '^(shared/|\.github/workflows/shared-contracts-ci\.yml$)'; then
            echo "shared=true" >> "$GITHUB_OUTPUT"
          else
            echo "shared=false" >> "$GITHUB_OUTPUT"
            echo "No changes under shared/; skipping the contract check." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Python
        if: steps.changes.outputs.shared == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: shared/scripts/requirements.txt

      - name: Install check dependencies
        if: steps.changes.outputs.shared == 'true'
        run: pip install -r shared/scripts/requirements.txt

      - name: Check shared contracts
        if: steps.changes.outputs.shared == 'true'
        run: python shared/scripts/check_contracts.py
